name: Build Debug APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FossifyPhone (foss/debug)
    runs-on: ubuntu-latest

    env:
      # ubuntu-latest 已经预装了 Android SDK，直接用它
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android cmdline-tools & SDK components
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"

          # 下载官方 cmdline-tools (固定版本，避免 latest 版本带来的不一致)
          CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -fL "$CMDLINE_URL" -o cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          rm cmdtools.zip

          # 把 sdkmanager 加进 PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          # 关键：先接受所有 license，避免 sdkmanager 因为没接受 license 退出码 1
          yes | sdkmanager --licenses >/dev/null || true

          # 安装需要的平台和构建工具（AGP 8.x 需要 platform-36）
          sdkmanager "platform-tools" \
                     "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "platforms;android-34"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Generate default debug keystore
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkey -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK (foss flavor)
        run: |
          export ANDROID_HOME="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          ./gradlew :app:assembleFossDebug --no-daemon --stacktrace

      - name: Rename APK with commit SHA
        id: rename
        run: |
          SHA=${GITHUB_SHA::8}
          SRC=$(find app/build/outputs/apk/foss/debug -name "*.apk" -type f | head -1)
          DEST="FossifyPhone-foss-debug-${SHA}.apk"
          cp "$SRC" "$DEST"
          echo "apk_name=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FossifyPhone-foss-debug-${{ github.sha }}
          path: ${{ steps.rename.outputs.apk_name }}
          retention-days: 90

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
