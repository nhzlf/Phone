name: Build Debug APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FossifyPhone (foss/debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK (cmdline-tools + platform-36)
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Install missing Android SDK components
        run: |
          yes | sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Generate default debug keystore
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkey -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK (foss flavor)
        run: ./gradlew :app:assembleFossDebug --no-daemon --stacktrace

      - name: Rename APK with commit SHA
        id: rename
        run: |
          SHA=${GITHUB_SHA::8}
          SRC=$(find app/build/outputs/apk/foss/debug -name "*.apk" -type f | head -1)
          DEST="FossifyPhone-foss-debug-${SHA}.apk"
          cp "$SRC" "$DEST"
          echo "apk_name=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FossifyPhone-foss-debug-${{ github.sha }}
          path: ${{ steps.rename.outputs.apk_name }}
          retention-days: 90

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
